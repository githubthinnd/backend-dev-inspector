<svg xmlns="http://www.w3.org/2000/svg" width="914" height="330" viewBox="0 0 914 330" role="img" aria-label="backend-dev-inspector: a transaction with a rolled-back savepoint">
  <title>backend-dev-inspector: a transaction with a rolled-back savepoint</title>
  <rect width="914" height="330" rx="10" fill="#0d1117"/>
  <rect width="914" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="914" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="457" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6e7681">backend-dev-inspector: a transaction with a rolled-back savepoint</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#c9d1d9">
    <text x="24" y="58" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">GET /api/orders/transaction → 200 1.00ms total · 3 queries · 0.11ms in SQL</tspan></text>
    <text x="24" y="79" xml:space="preserve"><tspan fill="#6e7681">└─ </tspan><tspan fill="#79c0ff" font-weight="700">TRANSACTION</tspan><tspan fill="#6e7681"> [conn -1]</tspan><tspan fill="#7ee787"> Committed</tspan><tspan fill="#6e7681"> 1.03ms</tspan></text>
    <text x="24" y="100" xml:space="preserve"><tspan fill="#6e7681">   ├─ </tspan><tspan fill="#79c0ff" font-weight="700">INSERT</tspan><tspan fill="#6e7681"> [better-sqlite3]</tspan><tspan fill="#7ee787"> orders</tspan><tspan fill="#6e7681"> 0.04ms · 1 affected</tspan></text>
    <text x="24" y="121" xml:space="preserve"><tspan fill="#6e7681">   │  </tspan><tspan fill="#8b949e">insert into orders (customer_id, status, total_cents, created_at) values (?, ?, ?, ?)</tspan></text>
    <text x="24" y="142" xml:space="preserve"><tspan fill="#6e7681">   │  </tspan><tspan fill="#8b949e">↳ shared/src/sqlite.ts:28</tspan></text>
    <text x="24" y="163" xml:space="preserve"><tspan fill="#6e7681">   ├─ </tspan><tspan fill="#79c0ff" font-weight="700">INSERT</tspan><tspan fill="#6e7681"> [better-sqlite3]</tspan><tspan fill="#7ee787"> order_items</tspan><tspan fill="#6e7681"> 0.04ms · 1 affected</tspan></text>
    <text x="24" y="184" xml:space="preserve"><tspan fill="#6e7681">   │  </tspan><tspan fill="#8b949e">insert into order_items (order_id, product_id, quantity, unit_price_cents) values (?, ?, ?, ?)</tspan></text>
    <text x="24" y="205" xml:space="preserve"><tspan fill="#6e7681">   │  </tspan><tspan fill="#8b949e">↳ shared/src/sqlite.ts:30</tspan></text>
    <text x="24" y="226" xml:space="preserve"><tspan fill="#6e7681">   └─ </tspan><tspan fill="#79c0ff" font-weight="700">SAVEPOINT</tspan><tspan fill="#7ee787">  [conn -1] Rolled back</tspan><tspan fill="#6e7681"> 0.03ms</tspan></text>
    <text x="24" y="247" xml:space="preserve"><tspan fill="#6e7681">      └─ </tspan><tspan fill="#79c0ff" font-weight="700">INSERT</tspan><tspan fill="#6e7681"> [better-sqlite3]</tspan><tspan fill="#7ee787"> order_items</tspan><tspan fill="#6e7681"> 0.03ms · 1 affected</tspan></text>
    <text x="24" y="268" xml:space="preserve"><tspan fill="#6e7681">         </tspan><tspan fill="#8b949e">insert into order_items (order_id, product_id, quantity, unit_price_cents) values (?, ?, ?, ?)</tspan></text>
    <text x="24" y="289" xml:space="preserve"><tspan fill="#6e7681">         </tspan><tspan fill="#8b949e">↳ shared/src/sqlite.ts:33</tspan></text>
  </g>
