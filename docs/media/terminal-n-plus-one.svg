<svg xmlns="http://www.w3.org/2000/svg" width="1199" height="351" viewBox="0 0 1199 351" role="img" aria-label="backend-dev-inspector: an N+1 in the terminal">
  <title>backend-dev-inspector: an N+1 in the terminal</title>
  <rect width="1199" height="351" rx="10" fill="#0d1117"/>
  <rect width="1199" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="1199" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="599.5" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6e7681">backend-dev-inspector: an N+1 in the terminal</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#c9d1d9">
    <text x="24" y="58" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">GET /api/orders/n-plus-one → 200 16.0ms total · 11 queries · 0.31ms in SQL</tspan></text>
    <text x="24" y="79" xml:space="preserve"><tspan fill="#6e7681">├─ </tspan><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#6e7681"> [better-sqlite3]</tspan><tspan fill="#7ee787"> orders</tspan><tspan fill="#6e7681"> 0.12ms · 10 rows</tspan></text>
    <text x="24" y="100" xml:space="preserve"><tspan fill="#6e7681">│  </tspan><tspan fill="#8b949e">select id, customer_id as customerId, status, total_cents as totalCents from orders order by id desc limit ?</tspan></text>
    <text x="24" y="121" xml:space="preserve"><tspan fill="#6e7681">│  </tspan><tspan fill="#8b949e">↳ shared/src/sqlite.ts:14</tspan></text>
    <text x="24" y="142" xml:space="preserve"><tspan fill="#6e7681">├─ </tspan><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#6e7681"> [better-sqlite3]</tspan><tspan fill="#7ee787"> customers</tspan><tspan fill="#6e7681"> 0.03ms · 1 row</tspan></text>
    <text x="24" y="163" xml:space="preserve"><tspan fill="#6e7681">│  </tspan><tspan fill="#8b949e">select id, name, country from customers where id = ?</tspan></text>
    <text x="24" y="184" xml:space="preserve"><tspan fill="#6e7681">│  </tspan><tspan fill="#8b949e">↳ shared/src/sqlite.ts:15</tspan></text>
    <text x="24" y="205" xml:space="preserve"><tspan fill="#6e7681">│  </tspan><tspan fill="#8b949e">… 8 more statements</tspan></text>
    <text x="24" y="226" xml:space="preserve"><tspan fill="#6e7681">└─ </tspan><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#6e7681"> [better-sqlite3]</tspan><tspan fill="#7ee787"> customers</tspan><tspan fill="#6e7681"> 0.04ms · 1 row</tspan></text>
    <text x="24" y="247" xml:space="preserve"><tspan fill="#6e7681">   </tspan><tspan fill="#8b949e">select id, name, country from customers where id = ?</tspan></text>
    <text x="24" y="268" xml:space="preserve"><tspan fill="#6e7681">   </tspan><tspan fill="#8b949e">↳ shared/src/sqlite.ts:15</tspan></text>
    <text x="24" y="289" xml:space="preserve"><tspan fill="#d29922">⚠ 10 similar queries, 0.19ms in total — select id, name, country from customers where id = ?</tspan></text>
    <text x="24" y="310" xml:space="preserve"><tspan fill="#6e7681">  How to fix: Load them in one go: a join, a WHERE … IN (…) over the ids, or your ORM's eager loading (Drizzle `with`, Prisma `include`).</tspan></text>
  </g>
