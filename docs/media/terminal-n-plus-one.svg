    <text x="24" y="58" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">GET /api/orders/n-plus-one → 200 2.00ms total · 11 queries · 0.11ms in SQL</tspan></text>
    <text x="24" y="79" xml:space="preserve"><tspan fill="#6e7681">├─ </tspan><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#6e7681"> [better-sqlite3]</tspan><tspan fill="#7ee787"> orders</tspan><tspan fill="#6e7681"> 0.05ms · 10 rows</tspan></text>
    <text x="24" y="100" xml:space="preserve"><tspan fill="#6e7681">│  </tspan><tspan fill="#8b949e">select id, customer_id as customerId, status, total_cents as totalCents from orders order by id desc limit ?</tspan></text>
    <text x="24" y="121" xml:space="preserve"><tspan fill="#6e7681">├─ </tspan><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#6e7681"> [better-sqlite3]</tspan><tspan fill="#7ee787"> customers</tspan><tspan fill="#6e7681"> 0.02ms · 1 row</tspan></text>
