name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new advisory against a dev dependency shows up without waiting for a push.
    - cron: "17 3 * * 1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # `npm ci` installs exactly what package-lock.json says; install scripts of dependencies do not run.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Known vulnerabilities
        run: npm audit --audit-level=high
      - name: Registry signatures and provenance of installed packages
        run: npm audit signatures
